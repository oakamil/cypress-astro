[package]
name = "cypress-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cypress-server"
path = "src/main.rs"

[dependencies]
cedar-camera = { path = "../../cedar-camera" }
cypress-solver = { path = "../cypress-solver" }
cypress-imu = { path = "../cypress-imu" }
olive-imu = { path = "../../olive-solve/olive-imu" }
cedar-elements = { path = "../../cedar-server/elements" }
cedar-server = { path = "../../cedar-server/server" }
pico-args = "0.5.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
tetra3 = { git = "https://github.com/oakamil/olive-solve.git" }
image = "0.25.10"
starfield = "0.12.6"
async-trait = "0.1.89"
canonical-error = "0.1.0"
log = "0.4.32"
rusqlite = { version = "0.40.1", features = ["bundled"] }
bincode = "1.3"
rstar = { version = "0.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
